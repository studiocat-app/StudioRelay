[package]
name = "relay-protocol"
description = "StudioRelay device protocol: messages exchanged between a Mac and the relay."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
schema = ["dep:schemars"]

[lints]
workspace = true

[[example]]
name = "export_schema"
required-features = ["schema"]

[dependencies]
serde = { version = "1", features = ["derive"] }
schemars = { version = "1", optional = true }

[dev-dependencies]
serde_json = "1"
