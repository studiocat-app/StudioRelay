[workspace]
resolver = "3"
members = [
    "crates/relay-protocol",
    "crates/relay-core",
    "crates/relay-license",
    "crates/relay-sni",
    "crates/host-server",
    "crates/host-cloudflare",
]
# host-cloudflare only builds for wasm32; native builds and tests skip it.
default-members = [
    "crates/relay-protocol",
    "crates/relay-core",
    "crates/relay-license",
    "crates/relay-sni",
    "crates/host-server",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/studiocat-app/StudioRelay"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = true
codegen-units = 1
